# Ideal Customer Profile — copy to config/icp.yaml and edit for your business.
# This drives both what Apollo.io searches for and how leads get scored/ranked
# ("best clients" = highest score). Nothing here is a hard filter on its own;
# min_score_to_contact is what actually gates outreach.
#
# Pre-filled for a post-construction cleanup business. Your real, paying,
# repeat customers for this trade are almost never individual homeowners —
# they're the businesses who run construction projects and need the site
# turned over clean at the end of every one: general contractors, builders,
# remodelers, developers, and the property managers / real estate agents who
# need units move-in-ready. Apollo (the data source this pulls from) is a B2B
# contact database, so it can only reach those businesses anyway — it has no
# way to cold-email individual homeowners, and you shouldn't want it to.

target_industries:
  - "general contractor"
  - "construction"
  - "home builder"
  - "remodeling"
  - "property management"
  - "real estate development"

target_titles:
  - "Owner"
  - "General Contractor"
  - "Project Manager"
  - "Construction Manager"
  - "Site Superintendent"
  - "Property Manager"
  - "Real Estate Developer"

company_size_min: 2
company_size_max: 250

# REQUIRED: set this to your actual service area before running sourcing —
# this is what keeps every lead within driving distance. Be as specific as
# your Apollo plan allows (city/metro beats state beats country).
target_locations:
  - "Austin, Texas"

# Extra points if these words show up in the company's name/description —
# tuned to catch contractors who are actively building (i.e. will need
# cleanup soon), not just any construction-adjacent company.
keywords_boost:
  - "new construction"
  - "remodel"
  - "renovation"
  - "custom homes"
  - "spec homes"
  - "multifamily"

exclude_domains:
  - "gmail.com"
  - "yahoo.com"
  - "hotmail.com"

# Score is 0.0-1.0 (see app/icp.py). Below this, a lead is stored but never
# queued for outreach. Lowering this raises volume but drops average fit —
# see the note in docs/SETUP.md on sizing this against your sending limits.
min_score_to_contact: 0.6
