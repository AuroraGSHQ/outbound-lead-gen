{% extends "base.html" %}
{% block content %}
<h1>Leads</h1>
<form method="get" action="/leads">
  <input type="text" name="q" value="{{ q }}" placeholder="Search company or email">
  <button type="submit" class="secondary">Search</button>
</form>
<table>
  <tr><th>Company</th><th>Contact</th><th>Status</th><th>Source</th><th></th></tr>
  {% for lead in leads %}
  <tr>
    <td>{{ lead.company_name }}</td>
    <td>{{ lead.contact_name }} &lt;{{ lead.contact_email }}&gt;</td>
    <td>{{ lead.status }}</td>
    <td>{{ lead.source }}</td>
    <td><a href="/intake/new?lead_id={{ lead.id }}">Start intake →</a></td>
  </tr>
  {% endfor %}
</table>
{% endblock %}
